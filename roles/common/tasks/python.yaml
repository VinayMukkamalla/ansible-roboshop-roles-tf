- name: install python package
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  loop:
  - python3
  - openssl
  - gcc
  - openssl-devel
  - python3-devel

- name: installing dependencies
  ansible.builtin.pip:
    executable: pip3.9
    requirements: requirements.txt
  args:
    chdir: /app