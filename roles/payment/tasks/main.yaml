- name: app setup
  ansible.builtin.import_role:
    name: common
    tasks_from: app-setup.yaml

- name: upgrade openssl first to avoid version mismatch
  ansible.builtin.dnf:
    name:
      - openssl
      - openssl-libs
      - openssh
      - openssh-server
      - openssh-clients
    state: latest
    
- name: install python
  ansible.builtin.dnf:
    name:
      - python3
      - python3-pip
      - gcc
      - python3-devel
    state: present

- name: install python crypto libraries
  ansible.builtin.pip:
    name:
      - cryptography
      - paramiko
      - ansible
    state: latest

