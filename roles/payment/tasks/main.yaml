- name: app setup
  ansible.builtin.import_role:
    name: common
    tasks_from: app-setup.yaml

- name: install python package
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: absent
  loop:
  - python3-cryptography
  - python3-paramiko

- name: python setup
  ansible.builtin.import_role:
    name: common
    tasks_from: python.yaml

- name: systemd setup
  ansible.builtin.import_role:
    name: common
    tasks_from: system-setup.yaml